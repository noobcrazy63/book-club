<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Green-Seel Book Club</title>
    <style>
        :root {
            --primary: #3ade65;     
            --secondary: #000000;   
            --bg: #f2fbf4;          
            --white: #ffffff;
            --muted-text: #555555;
            --instock: #2a9d8f;     
            --outstock: #e63946;    
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--secondary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px; 
            background: var(--white);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 15px;
        }

        .brand-header img {
            max-width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: contain;
            border-radius: 6px;
        }

        h2, h3, h4 {
            color: var(--secondary);
            font-weight: 700;
        }

        .hidden {
            display: none !important;
        }

        /* Forms */
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 2px solid var(--primary);
            background-color: var(--white);
            color: var(--secondary);
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.15);
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            background-color: var(--primary);
            color: var(--secondary);
            border: 2px solid var(--secondary);
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--secondary);
            color: var(--primary);
        }

        /* Dashboard Navbar */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .logout-btn {
            width: auto;
            padding: 6px 15px;
            background-color: var(--secondary);
            color: var(--white);
            border: 1px solid var(--secondary);
        }

        /* Twin Input Columns */
        .log-row {
            display: flex;
            gap: 15px;
        }
        .log-col {
            flex: 1;
        }

        /* Book Grid Layout */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .book-card {
            border: 2px solid #eeeeee;
            border-radius: 8px;
            padding: 15px;
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100px;
        }

        .book-info-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            gap: 12px;
        }

        .book-title {
            font-size: 16px;
            font-weight: bold;
            line-height: 1.3;
        }

        .book-author {
            font-size: 13px;
            color: var(--muted-text);
            font-style: italic;
            margin-top: 2px;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .stock-status {
            font-size: 12px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .stock-status.in { background-color: #e2f4f1; color: var(--instock); }
        .stock-status.out { background-color: #ffeef0; color: var(--outstock); }

        .choose-btn {
            width: auto;
            padding: 4px 12px;
            margin: 0;
            font-size: 13px;
        }

        /* Selected Progress Section */
        .selected-box {
            background-color: #f9f9f9;
            border: 2px dashed var(--primary);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .progress-item {
            margin: 15px 0;
            background: #fff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .progress-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .progress-labels {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .progress-book-name {
            font-weight: bold;
            font-size: 15px;
        }

        .progress-book-stats {
            font-size: 13px;
            color: var(--muted-text);
        }

        .turn-in-btn {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        .turn-in-btn:hover {
            background-color: #b8222e;
            color: white;
        }

        .progress-bar-bg {
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            height: 12px;
            width: 100%;
        }

        .progress-bar-fill {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        hr {
            border: 0; height: 2px; background: var(--primary); margin: 30px 0;
        }

        .log-entry {
            background: #e6f9ed;
            padding: 12px;
            margin: 8px 0;
            border-left: 5px solid var(--primary);
            border-radius: 0 6px 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Leaderboard Styles */
        .leaderboard-box {
            background: #ffffff;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }
        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            margin-bottom: 5px;
            background: #fdfdfd;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }
        .leaderboard-item.top-reader {
            background: #e6f9ed;
            border-color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="brand-header">
        <img src="Screenshot 2026-05-22 4.56.22 PM.png" alt="The Green-Seel Book Club Banner">
    </div>
    
    <div id="auth-section">
        <h2>Welcome! Please Set Up Your Profile</h2>
        <form id="auth-form">
            <input type="text" id="auth-name" placeholder="What is your name?" required>
            <button type="submit">Start Tracking Progress</button>
        </form>
    </div>

    <div id="dashboard-section" class="hidden">
        <div class="nav-bar">
            <h2>Welcome Back, <span id="user-display-name">Reader</span>!</h2>
            <button class="logout-btn" onclick="clearProfile()">Reset Profile</button>
        </div>

        <div id="tracking-box" class="selected-box hidden">
            <h3>📈 Your Reading Progress</h3>
            <div id="progress-container"></div>
        </div>

        <div class="log-row">
            <div class="log-col">
                <h3>⏱️ Update Pages Read</h3>
                <form id="log-form">
                    <select id="log-book-select" required>
                        <option value="" disabled selected>Choose book to update...</option>
                    </select>
                    <input type="number" id="pages-read" placeholder="Pages read this session?" min="1" required>
                    <button type="submit">Log Pages</button>
                </form>
            </div>
            <div class="log-col">
                <h3>⏳ Session Clock</h3>
                <form id="minute-form">
                    <input type="number" id="minutes-read" placeholder="How many minutes?" min="1" required>
                    <button type="submit">Log Minutes</button>
                </form>
            </div>
        </div>

        <h4>Totals Tracker: <span id="total-pages">0</span> pages read | <span id="total-minutes">0</span> minutes spent</h4>
        
        <div class="leaderboard-box">
            <h3>🏆 Club Leaderboard</h3>
            <ul id="leaderboard-list" class="leaderboard-list"></ul>
        </div>

        <div id="log-history"></div>

        <hr>

        <h3>📚 Available Library Books</h3>
        <div class="book-grid" id="catalog-grid"></div>
    </div>

</div>

<script>
    const defaultBooks = [
        { title: "I.R.L.", author: "Chris Valdez", pages: 256, inStock: true },
        { title: "Donut Go Breaking My Heart", author: "Suzanne Nelson", pages: 272, inStock: true },
        { title: "The Misfits", author: "James Patterson", pages: 290, inStock: true },
        { title: "The Bletchley Riddle", author: "Ruta Sepetys & Kristy Cambron", pages: 368, inStock: true },
        { title: "Middle School Get Me Out Of Here", author: "James Patterson", pages: 304, inStock: true },
        { title: "All's Faire in Middle School", author: "Victoria Jamieson", pages: 240, inStock: true },
        { title: "What is Juneteenth?", author: "Kirsti Jewel", pages: 112, inStock: true },
        { title: "Everything for a Dog", author: "Ann M. Martin", pages: 240, inStock: true },
        { title: "A Batch Made In Heaven", author: "Suzanne Nelson", pages: 250, inStock: true },
        { title: "Growing Home", author: "Susan L. Lipson", pages: 208, inStock: true },
        { title: "Olivetti", author: "Allie Millington", pages: 256, inStock: true },
        { title: "Return to Sender", author: "Julia Alvarez", pages: 336, inStock: true },
        { title: "The Playbook", author: "Kwame Alexander", pages: 176, inStock: true },
        { title: "Out of My Mind", author: "Sharon M. Draper", pages: 320, inStock: true },
        { title: "Where the Red Fern Grows", author: "Wilson Rawls", pages: 256, inStock: true },
        { title: "Where is the Bermuda Triangle?", author: "Megan Stine", pages: 112, inStock: true },
        { title: "I Survived Graphic Novel: The Great Molasses Flood, 1919", author: "Lauren Tarshis", pages: 160, inStock: true },
        { title: "Where is the Eiffel Tower?", author: "Dina Anastasio", pages: 112, inStock: true },
        { title: "Percy Jackson I", author: "Rick Riordan", pages: 384, inStock: true },
        { title: "Percy Jackson II", author: "Rick Riordan", pages: 288, inStock: true },
        { title: "Percy Jackson III", author: "Rick Riordan", pages: 320, inStock: true },
        { title: "Me Frida", author: "Amy Novesky", pages: 40, inStock: true },
        { title: "My Jasper June", author: "Laurel Snyder", pages: 304, inStock: true },
        { title: "Are you there God? It's Me Margaret", author: "Judy Blume", pages: 192, inStock: true },
        { title: "Zeus", author: "George O'Connor", pages: 80, inStock: true },
        { title: "Deep Water", author: "Watt Key", pages: 272, inStock: true },
        { title: "Anne Frank", author: "Anne Frank", pages: 352, inStock: true }
    ];

    let bookDatabase = [...defaultBooks];
    let currentUserName = "";
    let selectedBooks = {}; 
    let totalPagesRead = 0;
    let totalMinutesRead = 0;

    // DOM Bindings
    const authSection = document.getElementById('auth-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const authForm = document.getElementById('auth-form');
    const authName = document.getElementById('auth-name');
    const userDisplayName = document.getElementById('user-display-name');
    const catalogGrid = document.getElementById('catalog-grid');
    const trackingBox = document.getElementById('tracking-box');
    const progressContainer = document.getElementById('progress-container');
    const logBookSelect = document.getElementById('log-book-select');
    const logForm = document.getElementById('log-form');
    const minuteForm = document.getElementById('minute-form');
    const totalPagesDisplay = document.getElementById('total-pages');
    const totalMinutesDisplay = document.getElementById('total-minutes');
    const logHistory = document.getElementById('log-history');
    const leaderboardList = document.getElementById('leaderboard-list');

    function initApp() {
        const savedCatalog = localStorage.getItem('autoClubCatalogState');
        if (savedCatalog) {
            bookDatabase = JSON.parse(savedCatalog);
        }

        const savedName = localStorage.getItem('autoClubUserName');
        if (savedName) {
            currentUserName = savedName;

            const savedBooks = localStorage.getItem(`autoClubSelectedBooksData_${currentUserName}`);
            if (savedBooks) selectedBooks = JSON.parse(savedBooks);

            const savedPages = localStorage.getItem(`autoClubTotalPages_${currentUserName}`);
            if (savedPages) totalPagesRead = parseInt(savedPages);
            
            const savedMins = localStorage.getItem(`autoClubTotalMinutes_${currentUserName}`);
            if (savedMins) totalMinutesRead = parseInt(savedMins);

            loadDashboard();
        } else {
            renderCatalog();
        }
    }

    function renderCatalog() {
        catalogGrid.innerHTML = "";
        bookDatabase.forEach((book, index) => {
            const card = document.createElement('div');
            card.classList.add('book-card');
            
            card.innerHTML = `
                <div class="book-info-container">
                    <div>
                        <div class="book-title">${book.title}</div>
                        <div class="book-author">by ${book.author}</div>
                    </div>
                    <div class="status-container">
                        <span class="stock-status ${book.inStock ? 'in' : 'out'}">${book.inStock ? 'In Stock' : 'Out of Stock'}</span>
                        ${book.inStock ? `<button class="choose-btn" onclick="chooseBook(${index})">Choose</button>` : ''}
                    </div>
                </div>
            `;
            catalogGrid.appendChild(card);
        });
    }

    // Added function to automatically scan memory and construct leaderboard rankings
    function renderLeaderboard() {
        leaderboardList.innerHTML = "";
        let profiles = [];

        // Scan storage keys to find user accounts dynamically
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith("autoClubTotalPages_")) {
                const name = key.replace("autoClubTotalPages_", "");
                const pages = parseInt(localStorage.getItem(key)) || 0;
                profiles.push({ name: name, pages: pages });
            }
        }

        // Always include current user if they haven't saved pages yet
        if (currentUserName && !profiles.some(p => p.name === currentUserName)) {
            profiles.push({ name: currentUserName, pages: totalPagesRead });
        }

        // Sort profiles highest score to lowest score
        profiles.sort((a, b) => b.pages - a.pages);

        profiles.forEach((profile, index) => {
            const li = document.createElement('li');
            li.classList.add('leaderboard-item');
            if (index === 0 && profile.pages > 0) {
                li.classList.add('top-reader');
            }
            li.innerHTML = `
                <span>${index + 1}. <strong>${profile.name}</strong> ${index === 0 && profile.pages > 0 ? '👑' : ''}</span>
                <span>${profile.pages} pages</span>
            `;
            leaderboardList.appendChild(li);
        });
    }

    authForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const inputName = authName.value.trim();
        if (inputName !== "") {
            currentUserName = inputName;
            localStorage.setItem('autoClubUserName', currentUserName);
            
            const savedBooks = localStorage.getItem(`autoClubSelectedBooksData_${currentUserName}`);
            selectedBooks = savedBooks ? JSON.parse(savedBooks) : {};

            const savedPages = localStorage.getItem(`autoClubTotalPages_${currentUserName}`);
            totalPagesRead = savedPages ? parseInt(savedPages) : 0;
            
            const savedMins = localStorage.getItem(`autoClubTotalMinutes_${currentUserName}`);
            totalMinutesRead = savedMins ? parseInt(savedMins) : 0;

            loadDashboard();
        }
    });

    function loadDashboard() {
        authSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        userDisplayName.innerText = currentUserName;

        totalPagesDisplay.innerText = totalPagesRead;
        totalMinutesDisplay.innerText = totalMinutesRead;

        renderCatalog();
        updateDashboardProgressUI();
        renderLeaderboard();
    }

    function chooseBook(index) {
        const book = bookDatabase[index];
        if (!selectedBooks[book.title]) {
            selectedBooks[book.title] = { index: index, read: 0, total: book.pages };
            book.inStock = false; 
            
            saveToStorage();
            renderCatalog(); 
            updateDashboardProgressUI();
        }
    }

    function turnInBook(index) {
        const book = bookDatabase[index];
        if (book && selectedBooks[book.title]) {
            const title = book.title;
            delete selectedBooks[title]; 
            book.inStock = true;

            saveToStorage();
            renderCatalog();
            updateDashboardProgressUI();

            const entry = document.createElement('div');
            entry.classList.add('log-entry');
            entry.style.borderLeftColor = "#e63946";
            entry.innerHTML = `<span>🔄 Returned: <strong>"${title}"</strong> has been turned back in to the library!</span>`;
            logHistory.prepend(entry);
        }
    }

    function updateDashboardProgressUI() {
        progressContainer.innerHTML = "";
        logBookSelect.innerHTML = '<option value="" disabled selected>Choose book to update...</option>';
        
        const keys = Object.keys(selectedBooks);
        if (keys.length === 0) {
            trackingBox.classList.add('hidden');
            return;
        }
        
        trackingBox.classList.remove('hidden');
        keys.forEach(title => {
            const data = selectedBooks[title];
            const percentage = Math.min(Math.round((data.read / data.total) * 100), 100);
            
            const progItem = document.createElement('div');
            progItem.classList.add('progress-item');
            progItem.innerHTML = `
                <div class="progress-header-row">
                    <div class="progress-labels">
                        <span class="progress-book-name">${title}</span>
                        <span class="progress-book-stats">${data.read} / ${data.total} pages completed (${percentage}%)</span>
                    </div>
                    <button class="turn-in-btn" onclick="turnInBook(${data.index})">Turn In Book</button>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: ${percentage}%"></div>
                </div>
            `;
            progressContainer.appendChild(progItem);

            const opt = document.createElement('option');
            opt.value = title;
            opt.innerText = title;
            logBookSelect.appendChild(opt);
        });
    }

    logForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const selectedTitle = logBookSelect.value;
        const pagesEntered = parseInt(document.getElementById('pages-read').value);
        
        if (!selectedTitle || isNaN(pagesEntered)) return;

        selectedBooks[selectedTitle].read += pagesEntered;
        totalPagesRead += pagesEntered;
        totalPagesDisplay.innerText = totalPagesRead;

        saveToStorage();
        updateDashboardProgressUI();
        renderLeaderboard();

        const entry = document.createElement('div');
        entry.classList.add('log-entry');
        entry.innerHTML = `<span>📖 Progress: added <strong>${pagesEntered} pages</strong> to "${selectedTitle}"</span>`;
        logHistory.prepend(entry);

        document.getElementById('pages-read').value = '';
    });

    minuteForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const mins = parseInt(document.getElementById('minutes-read').value);
        if (isNaN(mins)) return;
        
        totalMinutesRead += mins;
        totalMinutesDisplay.innerText = totalMinutesRead;
        
        saveToStorage();

        const entry = document.createElement('div');
        entry.classList.add('log-entry');
        entry.innerHTML = `<span>⏳ Session: Clocked <strong>${mins} minutes</strong> of reading!</span>`;
        logHistory.prepend(entry);

        document.getElementById('minutes-read').value = '';
    });

    function saveToStorage() {
        localStorage.setItem(`autoClubSelectedBooksData_${currentUserName}`, JSON.stringify(selectedBooks));
        localStorage.setItem(`autoClubTotalPages_${currentUserName}`, totalPagesRead);
        localStorage.setItem(`autoClubTotalMinutes_${currentUserName}`, totalMinutesRead);
        localStorage.setItem('autoClubCatalogState', JSON.stringify(bookDatabase));
    }

    function clearProfile() {
        localStorage.removeItem('autoClubUserName');
        location.reload();
    }

    initApp();
</script>
</body>
</html>
